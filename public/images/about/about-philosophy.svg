<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Trading Philosophy Illustration</title>
  <desc id="desc">Professional trading dashboard with trend lines and strategy framework cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937" stop-opacity="0.95" />
      <stop offset="1" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />
  <g opacity="0.12" stroke="#94a3b8">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200M0 720h1200" />
    <path d="M150 0v800M300 0v800M450 0v800M600 0v800M750 0v800M900 0v800M1050 0v800" />
  </g>

  <rect x="70" y="64" width="1060" height="672" rx="24" fill="url(#panel)" stroke="#334155" />
  <text x="110" y="118" fill="#e2e8f0" font-size="28" font-family="Inter, Segoe UI, sans-serif" font-weight="700">SYSTEMATIC TRADING FRAMEWORK</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 522 L252 482 L336 512 L450 420 L560 448 L668 334 L772 366 L890 250 L1020 292"
      stroke="#22c55e" stroke-width="8" />
    <path d="M140 566 L252 560 L336 542 L450 516 L560 500 L668 488 L772 452 L890 440 L1020 408"
      stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 9" />
  </g>

  <g>
    <rect x="128" y="164" width="298" height="118" rx="14" fill="#0b1220" stroke="#374151" />
    <text x="152" y="204" fill="#f8fafc" font-size="21" font-family="Inter, Segoe UI, sans-serif" font-weight="600">Market Structure</text>
    <text x="152" y="236" fill="#94a3b8" font-size="17" font-family="Inter, Segoe UI, sans-serif">Trend, regime, and liquidity zones</text>

    <rect x="450" y="164" width="298" height="118" rx="14" fill="#0b1220" stroke="#374151" />
    <text x="474" y="204" fill="#f8fafc" font-size="21" font-family="Inter, Segoe UI, sans-serif" font-weight="600">Signal Validation</text>
    <text x="474" y="236" fill="#94a3b8" font-size="17" font-family="Inter, Segoe UI, sans-serif">Only A+ setups are executable</text>

    <rect x="772" y="164" width="298" height="118" rx="14" fill="#0b1220" stroke="#374151" />
    <text x="796" y="204" fill="#f8fafc" font-size="21" font-family="Inter, Segoe UI, sans-serif" font-weight="600">Risk Budget</text>
    <text x="796" y="236" fill="#94a3b8" font-size="17" font-family="Inter, Segoe UI, sans-serif">Defined before every position</text>
  </g>

  <g>
    <circle cx="890" cy="250" r="10" fill="#22c55e" />
    <circle cx="450" cy="420" r="10" fill="#22c55e" />
    <circle cx="668" cy="334" r="10" fill="#22c55e" />
    <circle cx="1020" cy="292" r="10" fill="#22c55e" />
  </g>
</svg>
