<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Risk Management Illustration</title>
  <desc id="desc">Risk dashboard showing stop-loss boundaries, position sizing and drawdown controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827" />
      <stop offset="1" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />
  <rect x="72" y="64" width="1056" height="672" rx="24" fill="#0f172a" stroke="#334155" />

  <text x="118" y="124" fill="#e2e8f0" font-size="28" font-family="Inter, Segoe UI, sans-serif" font-weight="700">RISK CONTROL MATRIX</text>

  <g>
    <rect x="120" y="176" width="640" height="420" rx="16" fill="#111827" stroke="#334155" />
    <path d="M164 520 L274 462 L388 472 L508 418 L612 392 L718 336"
      fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="164" y1="556" x2="718" y2="556" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 10" />
    <text x="168" y="582" fill="#fca5a5" font-size="18" font-family="Inter, Segoe UI, sans-serif">Hard Stop Loss Level</text>

    <rect x="494" y="256" width="210" height="94" rx="12" fill="#1f2937" stroke="#475569" />
    <text x="518" y="292" fill="#f8fafc" font-size="20" font-family="Inter, Segoe UI, sans-serif" font-weight="700">Max Risk</text>
    <text x="518" y="324" fill="#fbbf24" font-size="28" font-family="Inter, Segoe UI, sans-serif" font-weight="800">1.00R</text>
  </g>

  <g>
    <rect x="790" y="176" width="300" height="130" rx="14" fill="#111827" stroke="#374151" />
    <text x="820" y="218" fill="#f8fafc" font-size="22" font-family="Inter, Segoe UI, sans-serif" font-weight="700">Position Size</text>
    <text x="820" y="252" fill="#38bdf8" font-size="34" font-family="Inter, Segoe UI, sans-serif" font-weight="800">2.5%</text>
    <text x="820" y="280" fill="#94a3b8" font-size="17" font-family="Inter, Segoe UI, sans-serif">per trade allocation</text>

    <rect x="790" y="330" width="300" height="130" rx="14" fill="#111827" stroke="#374151" />
    <text x="820" y="372" fill="#f8fafc" font-size="22" font-family="Inter, Segoe UI, sans-serif" font-weight="700">Daily DD Cap</text>
    <text x="820" y="406" fill="#f97316" font-size="34" font-family="Inter, Segoe UI, sans-serif" font-weight="800">-2.0R</text>
    <text x="820" y="434" fill="#94a3b8" font-size="17" font-family="Inter, Segoe UI, sans-serif">auto cooldown trigger</text>

    <rect x="790" y="484" width="300" height="130" rx="14" fill="#111827" stroke="#374151" />
    <text x="820" y="526" fill="#f8fafc" font-size="22" font-family="Inter, Segoe UI, sans-serif" font-weight="700">Consecutive Loss</text>
    <text x="820" y="560" fill="#f472b6" font-size="34" font-family="Inter, Segoe UI, sans-serif" font-weight="800">3 Trades</text>
    <text x="820" y="588" fill="#94a3b8" font-size="17" font-family="Inter, Segoe UI, sans-serif">reduce exposure mode</text>
  </g>
</svg>
