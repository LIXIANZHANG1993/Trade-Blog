<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Trading System CTA Illustration</title>
  <desc id="desc">Integrated system board combining strategy modules, risk guardrails, and knowledge loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)" />
  <rect x="76" y="72" width="1048" height="656" rx="24" fill="#111827" stroke="#334155" />
  <text x="120" y="126" fill="#e2e8f0" font-size="28" font-family="Inter, Segoe UI, sans-serif" font-weight="700">TRADING OS DASHBOARD</text>

  <g>
    <rect x="120" y="174" width="300" height="172" rx="14" fill="#0f172a" stroke="#475569" />
    <text x="150" y="214" fill="#f8fafc" font-size="21" font-family="Inter, Segoe UI, sans-serif" font-weight="700">Strategy Engine</text>
    <text x="150" y="248" fill="#93c5fd" font-size="17" font-family="Inter, Segoe UI, sans-serif">Signal rank, context filter,</text>
    <text x="150" y="274" fill="#93c5fd" font-size="17" font-family="Inter, Segoe UI, sans-serif">execution trigger scoring</text>
  </g>

  <g>
    <rect x="450" y="174" width="300" height="172" rx="14" fill="#0f172a" stroke="#475569" />
    <text x="480" y="214" fill="#f8fafc" font-size="21" font-family="Inter, Segoe UI, sans-serif" font-weight="700">Risk Guardrails</text>
    <text x="480" y="248" fill="#fbbf24" font-size="17" font-family="Inter, Segoe UI, sans-serif">Position sizing and max DD</text>
    <text x="480" y="274" fill="#fbbf24" font-size="17" font-family="Inter, Segoe UI, sans-serif">auto cooldown conditions</text>
  </g>

  <g>
    <rect x="780" y="174" width="300" height="172" rx="14" fill="#0f172a" stroke="#475569" />
    <text x="810" y="214" fill="#f8fafc" font-size="21" font-family="Inter, Segoe UI, sans-serif" font-weight="700">Knowledge Loop</text>
    <text x="810" y="248" fill="#86efac" font-size="17" font-family="Inter, Segoe UI, sans-serif">Review, classify mistakes,</text>
    <text x="810" y="274" fill="#86efac" font-size="17" font-family="Inter, Segoe UI, sans-serif">update playbook weekly</text>
  </g>

  <g>
    <rect x="120" y="386" width="960" height="272" rx="16" fill="#0f172a" stroke="#475569" />
    <text x="150" y="430" fill="#f8fafc" font-size="22" font-family="Inter, Segoe UI, sans-serif" font-weight="700">Unified Workflow</text>
    <path d="M170 522h150M372 522h150M574 522h150M776 522h150" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <g fill="#1f2937" stroke="#475569">
      <rect x="170" y="478" width="150" height="88" rx="12" />
      <rect x="372" y="478" width="150" height="88" rx="12" />
      <rect x="574" y="478" width="150" height="88" rx="12" />
      <rect x="776" y="478" width="150" height="88" rx="12" />
    </g>
    <g fill="#cbd5e1" font-size="17" font-family="Inter, Segoe UI, sans-serif" font-weight="600">
      <text x="206" y="531">Plan</text>
      <text x="406" y="531">Execute</text>
      <text x="620" y="531">Review</text>
      <text x="820" y="531">Refine</text>
    </g>
  </g>
</svg>
